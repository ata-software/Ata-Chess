<!DOCTYPE html>
<html>
<head><title>Debug Bot</title></head>
<body>
<div id="output"></div>
<script>
window.consoleErrors = [];
window.onerror = function(msg, url, line, col, error) {
    window.consoleErrors.push(msg + ' at ' + url + ':' + line);
    return false;
};
const origError = console.error;
console.error = function(...args) {
    window.consoleErrors.push(args.join(' '));
    origError.apply(console, args);
};
</script>

<!-- Minimal mock elements needed by app.js -->
<canvas id="chess-canvas" width="400" height="400"></canvas>
<div id="board-container" style="width:400px; height:400px;"></div>
<div id="status-banner"></div>
<div id="top-player-name"></div>
<div id="bottom-player-name"></div>
<div id="top-player-panel"><div class="hud-avatar"></div></div>
<div id="bottom-player-panel"><div class="hud-avatar"></div></div>
<div id="top-player-badge"></div>
<div id="bottom-player-badge"></div>
<div id="top-captured-tray"></div>
<div id="bottom-captured-tray"></div>
<div id="top-material-diff"></div>
<div id="bottom-material-diff"></div>
<div id="move-history-list"></div>
<div id="top-player-timer"></div>
<div id="bottom-player-timer"></div>
<div id="game-over-modal" class="hidden"></div>
<div id="game-over-title"></div>
<div id="game-over-subtitle"></div>
<div id="promotion-modal" class="hidden"></div>
<button id="promo-queen"></button>
<button id="promo-rook"></button>
<button id="promo-bishop"></button>
<button id="promo-knight"></button>
<button id="btn-sound"></button>
<button id="btn-flip"></button>
<button id="btn-new-game"></button>
<button id="btn-rematch"></button>
<button id="btn-settings"></button>
<button id="btn-close-settings"></button>
<button id="btn-exit"></button>
<button id="btn-online"></button>
<div id="settings-modal" class="hidden"></div>
<div id="online-modal" class="hidden"></div>
<button id="btn-close-online"></button>
<div id="socket-status-badge"></div>
<button id="tab-host"></button>
<button id="tab-join"></button>
<div id="panel-host"></div>
<div id="panel-join"></div>
<button id="btn-create-room"></button>
<div id="host-code-display"></div>
<div id="host-room-code"></div>
<input id="input-room-code" />
<button id="btn-join-room"></button>
<select id="select-difficulty"><option value="orta">Orta</option></select>
<select id="select-mode"><option value="vs-bot">Bot</option></select>
<select id="select-timer"><option value="0">0</option></select>
<select id="select-theme"><option value="wood">Wood</option></select>
<div id="lobby-screen"></div>
<button id="lobby-start-btn"></button>
<input id="lobby-nickname-input" value="TestUser" />
<div id="lobby-nickname-wrap"></div>
<button id="lobby-nickname-clear"></button>
<div id="lobby-difficulty-section"></div>
<div id="lobby-online-section"></div>
<button id="lobby-mode-bot"></button>
<button id="lobby-mode-pvp"></button>
<button id="lobby-mode-online"></button>
<div id="check-bot"></div>
<div id="check-pvp"></div>
<div id="check-online"></div>
<div id="lobby-socket-status"></div>
<button id="lobby-btn-create-room"></button>
<button id="lobby-btn-join-room"></button>
<input id="lobby-input-room-code" />
<button id="lobby-tab-host"></button>
<button id="lobby-tab-join"></button>
<div id="lobby-panel-host"></div>
<div id="lobby-panel-join"></div>
<div id="header-mode-badge"></div>
<div id="acc-mode-val"></div>

<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/socket.js"></script>
<script src="js/canvas.js"></script>
<script src="js/app.js"></script>

<script>
window.addEventListener('load', () => {
    const out = document.getElementById('output');
    out.innerHTML += "<p>Page loaded. Errors so far: " + JSON.stringify(window.consoleErrors) + "</p>";
    
    // Start game
    const startBtn = document.getElementById('lobby-start-btn');
    startBtn.click();
    out.innerHTML += "<p>Clicked startBtn. Errors: " + JSON.stringify(window.consoleErrors) + "</p>";
    
    // Find canvas
    const canvas = document.getElementById('chess-canvas');
    // Dispatch mousedown on e2 (White pawn)
    // Board is 400x400, squareSize is 50.
    // e2 is col 4 (x: 200..250, center 225), row 6 (y: 300..350, center 325)
    canvas.dispatchEvent(new MouseEvent('mousedown', { offsetX: 225, offsetY: 325, clientX: 225, clientY: 325, bubbles: true }));
    out.innerHTML += "<p>MouseDown e2 dispatched. Banner: " + document.getElementById('status-banner').innerHTML + "</p>";
    
    // Move to e4: col 4, row 4 (y: 200..250, center 225)
    canvas.dispatchEvent(new MouseEvent('mouseup', { offsetX: 225, offsetY: 225, clientX: 225, clientY: 225, bubbles: true }));
    out.innerHTML += "<p>MouseUp e4 dispatched. Banner: " + document.getElementById('status-banner').innerHTML + "</p>";

    // Wait 500ms and check status
    setTimeout(() => {
        out.innerHTML += "<p>After 500ms: Banner: " + document.getElementById('status-banner').innerHTML + "</p>";
        out.innerHTML += "<p>Errors: " + JSON.stringify(window.consoleErrors) + "</p>";
        out.innerHTML += "<p>History items: " + document.querySelectorAll('.history-item').length + "</p>";
        
        // Wait another 500ms
        setTimeout(() => {
            out.innerHTML += "<p>After 1000ms: Banner: " + document.getElementById('status-banner').innerHTML + "</p>";
            out.innerHTML += "<p>Errors: " + JSON.stringify(window.consoleErrors) + "</p>";
            out.innerHTML += "<p>History items: " + document.querySelectorAll('.history-item').length + "</p>";
            out.innerHTML += "<p>TEST_FINISH</p>";
        }, 500);
    }, 500);
});
</script>
</body>
</html>
