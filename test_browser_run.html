<!DOCTYPE html>
<html>
<head><title>Test App Run</title></head>
<body>
<iframe id="game" src="http://127.0.0.1:5500/index.html" width="450" height="850"></iframe>
<div id="log"></div>
<script>
const log = (msg) => {
    const p = document.createElement('p');
    p.textContent = msg;
    document.getElementById('log').appendChild(p);
};

window.addEventListener('load', () => {
    const iframe = document.getElementById('game');
    iframe.onload = () => {
        log('Iframe loaded');
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument;

        win.addEventListener('error', (e) => {
            log('IFRAME ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });

        setTimeout(() => {
            const nickInput = doc.getElementById('lobby-nickname-input');
            if (nickInput) {
                nickInput.value = 'Ahmet';
                nickInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            const startBtn = doc.getElementById('lobby-start-btn');
            log('Start button found: ' + !!startBtn);
            if (startBtn) startBtn.click();

            setTimeout(() => {
                log('After start. Banner: ' + doc.getElementById('status-banner').textContent);
                const canvas = doc.getElementById('chess-board');
                log('Canvas dimensions: ' + canvas.width + 'x' + canvas.height + ' CSS: ' + canvas.clientWidth + 'x' + canvas.clientHeight);

                const rect = canvas.getBoundingClientRect();
                const sz = canvas.clientWidth / 8;
                log('Square CSS sz: ' + sz);

                const e2x = rect.left + 4 * sz + sz/2;
                const e2y = rect.top + 6 * sz + sz/2;
                const e4x = rect.left + 4 * sz + sz/2;
                const e4y = rect.top + 4 * sz + sz/2;

                log('Simulating move e2 -> e4');
                canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: e2x, clientY: e2y, bubbles: true }));
                
                setTimeout(() => {
                    canvas.dispatchEvent(new MouseEvent('mouseup', { clientX: e4x, clientY: e4y, bubbles: true }));

                    let checks = 0;
                    const interval = setInterval(() => {
                        checks++;
                        const bannerText = doc.getElementById('status-banner').textContent;
                        const historyItems = doc.querySelectorAll('.history-item');
                        log('Check ' + checks + ': Banner="' + bannerText + '", History count=' + historyItems.length);
                        if (checks >= 10) {
                            clearInterval(interval);
                            log('COMPLETED');
                        }
                    }, 400);
                }, 200);
            }, 600);
        }, 500);
    };
});
</script>
</body>
</html>
